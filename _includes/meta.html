<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title == "Home" %}{{ site.title }}{% else %}{{ site.title }} | {{ page.title }}{% endif %}">
<meta property="og:description" content="{% if page.title == "Home" %}{{ site.description }}{% else %}{{ page.description }}{% endif %}">
<meta property="og:image" content="{{ site.url }}/assets/preview.png">
<meta property="og:url" content="{{ site.url }}">

<link rel="canonical" href="{{ site.url }}{{ page.url }}">

<link rel="icon" type="image/x-icon" href="{{ site.url }}/assets/images/favicon.png">

<meta name="title" content="{% if page.title == "Home" %}{{ site.title }}{% else %}{{ site.title }} | {{ page.title }}{% endif %}">
<meta name="description" content="{% if page.title == "Home" %}{{ site.description }}{% else %}{{ page.description }}{% endif %}">
<meta name="keywords" content="Arijeet Baruah, Gameplay Programmer, Unity Developer, Game Developer, C#, Game Systems, Indie Developer, Portfolio, Game Programming">
<meta name="author" content="{{ site.author.name }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title == "Home" %}{{ site.title }}{% else %}{{ site.title }} | {{ page.title }}{% endif %}">
<meta name="twitter:description" content="{% if page.title == "Home" %}{{ site.description }}{% else %}{{ page.description }}{% endif %}">
<meta name="twitter:image" content="{{ site.url }}/assets/preview.png">

<meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
